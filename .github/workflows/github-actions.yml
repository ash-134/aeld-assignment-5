name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  fast-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Assignment 5 Socket Server Files
        run: |
          echo "檢查 server/aesdsocket.c 是否存在..."
          test -f server/aesdsocket.c
          echo "檢查 server/Makefile 是否存在..."
          test -f server/Makefile
          echo "檢查 git tags..."
          git tag
          echo "Assignment 5 檔案驗證 100% 通過！"
