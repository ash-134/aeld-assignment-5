name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Test Socket Server
        run: |
          echo "開始編譯 server..."
          cd server
          make
          echo "測試背景 Daemon 模式啟動..."
          ./aesdsocket -d
          sleep 1
          echo "檢查程序是否正在運行..."
          pgrep aesdsocket
          echo "關閉行程..."
          pkill aesdsocket
          echo "編譯與測試全部成功！"
