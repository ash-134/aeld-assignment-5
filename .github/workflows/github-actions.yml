name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile aesdsocket
        run: |
          cd server
          make clean
          make
          echo "aesdsocket 編譯成功！"
